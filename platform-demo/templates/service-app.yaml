apiVersion: v1
kind: Service
metadata:
  name: fastapi-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: fastapi-app
    {{- include "platform-demo.labels" . | nindent 4 }}
spec:
  selector:
    app: fastapi-app
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

