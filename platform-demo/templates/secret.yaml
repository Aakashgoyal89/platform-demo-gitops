{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-demo.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform-demo.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.secrets.dbUser | b64enc | quote }}
  DB_PASS: {{ .Values.secrets.dbPass | b64enc | quote }}
{{- end }}

