apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-demo.fullname" . }}-app
  namespace: {{ .Values.namespace }}
  labels:
    app: fastapi-app
    {{- include "platform-demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    redeploy-timestamp: "{{ now | unixEpoch }}"
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
        {{- include "platform-demo.labels" . | nindent 8 }}
    spec:
      serviceAccountName: app-sa
      containers:
        - name: fastapi
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "platform-demo.fullname" . }}-config
                  key: APP_MESSAGE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secret" (include "platform-demo.fullname" .)) .Values.secrets.existingSecretName }}
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secret" (include "platform-demo.fullname" .)) .Values.secrets.existingSecretName }}
                  key: DB_PASS
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

