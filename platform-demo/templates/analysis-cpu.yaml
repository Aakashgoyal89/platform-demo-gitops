apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage-check
  namespace: platform-demo
spec:
  metrics:
    - name: cpu-usage
      interval: 15s
      count: 3
      failureLimit: 2
      provider:
        kubernetes:
          metricName: cpu
          labelSelector:
            matchLabels:
              app: fastapi-app
          namespace: platform-demo
      successCondition: result < 80
