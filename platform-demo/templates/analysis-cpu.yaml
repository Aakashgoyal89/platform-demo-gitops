apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage-check
  namespace: {{ .Values.namespace }}
spec:
  metrics:
    - name: cpu-usage
      interval: 15s
      count: 3
      successCondition: result < 80
      provider:
        kubernetes:
          metricName: cpu
          namespace: {{ .Values.namespace }}
          labelSelector:
            matchLabels:
              app: fastapi-app

