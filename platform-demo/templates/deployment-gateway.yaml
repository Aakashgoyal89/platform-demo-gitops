apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-demo.fullname" . }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: fastapi-gateway
    {{- include "platform-demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    redeploy-timestamp: "{{ now | unixEpoch }}"
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: fastapi-gateway
  template:
    metadata:
      labels:
        app: fastapi-gateway
        {{- include "platform-demo.labels" . | nindent 8 }}
    spec:
      serviceAccountName: app-sa
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

